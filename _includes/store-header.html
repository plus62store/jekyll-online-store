<ion-header class="ion-no-border border-b border-zinc-800 bg-zinc-950/80 backdrop-blur-md sticky top-0">
  <ion-toolbar class="px-2">
    <div class="flex items-center justify-between w-full max-w-7xl mx-auto py-2">
      <div class="flex items-center gap-2 cursor-pointer" onclick="scrollToTop()">
        <span class="bg-white text-black font-extrabold px-2 py-0.5 text-lg tracking-tighter font-display uppercase">+62</span>
        <span class="font-display font-bold tracking-widest text-lg text-white">STORE</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleAiDrawer()" class="drawer-btn relative px-3 py-2 border border-purple-500/50 hover:border-purple-400 transition-colors bg-purple-950/30 text-purple-300 text-xs font-mono flex items-center gap-2 cursor-pointer rounded-none">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <ion-icon name="sparkles-outline" class="text-sm text-purple-300"></ion-icon>
          <span class="hidden sm:inline">AI STORE ASSISTANT</span>
        </button>
        <button onclick="openCartModal()" class="btn-cart relative p-2 border border-zinc-800 hover:border-zinc-600 transition-colors bg-zinc-900 cursor-pointer flex items-center justify-center rounded-none">
          <ion-icon name="bag-handle-outline" class="text-xl text-zinc-100 block" slot="icon-only"></ion-icon>
          <span id="cartBadge" class="hidden absolute -top-1 -right-1 bg-white text-black text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-zinc-950">0</span>
        </button>
      </div>
    </div>
  </ion-toolbar>
</ion-header>
