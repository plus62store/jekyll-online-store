<section id="loginPanel" class="mx-auto flex min-h-[70vh] max-w-md items-center px-4">
  <form id="loginForm" class="w-full border border-zinc-800 bg-zinc-900/60 p-6">
    <p class="mb-2 font-mono text-xs uppercase tracking-widest text-amber-400">// CONTROL ROOM</p>
    <h1 class="display mb-2 text-3xl font-bold">Masuk Admin</h1>
    <p class="mb-6 text-sm leading-relaxed text-zinc-400">Gunakan token admin untuk memantau backend dan mengatur campaign banner.</p>
    <label class="mb-2 block text-xs font-mono uppercase text-zinc-500" for="tokenInput">Admin token</label>
    <input id="tokenInput" type="password" autocomplete="current-password" class="mb-4 w-full border border-zinc-700 bg-zinc-950 px-3 py-3 text-sm" placeholder="Bearer token">
    <button class="w-full bg-amber-400 px-4 py-3 text-sm font-bold text-zinc-950 hover:bg-amber-300">Masuk Dashboard</button>
    <p id="loginError" class="mt-3 hidden text-xs text-red-400"></p>
  </form>
</section>
