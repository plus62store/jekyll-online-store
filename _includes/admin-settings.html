<section class="mb-6 border border-zinc-800 bg-zinc-900/40 p-5">
  <div class="mb-5"><p class="font-mono text-xs uppercase text-zinc-500">AI context</p><h2 class="display mt-1 text-xl font-bold">Informasi Toko</h2><p class="mt-2 text-sm text-zinc-400">Context ini dipakai PAK eRTe saat menjawab chat user.</p></div>
  <div class="grid gap-3 sm:grid-cols-2">
    <label class="text-[10px] uppercase text-zinc-500">Nama toko<input id="settingStoreName" class="mt-1 w-full border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm"></label>
    <label class="text-[10px] uppercase text-zinc-500">Nomor WhatsApp admin<input id="settingWhatsapp" class="mt-1 w-full border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm"></label>
    <label class="text-[10px] uppercase text-zinc-500 sm:col-span-2">Alamat toko<textarea id="settingAddress" rows="2" class="mt-1 w-full border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm"></textarea></label>
    <label class="text-[10px] uppercase text-zinc-500">Link Google Maps<input id="settingMapsUrl" type="url" class="mt-1 w-full border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm"></label>
    <label class="text-[10px] uppercase text-zinc-500">E-mail<input id="settingEmail" type="email" class="mt-1 w-full border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm"></label>
    <label class="text-[10px] uppercase text-zinc-500">Jam operasional<input id="settingOperatingHours" class="mt-1 w-full border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm" placeholder="Senin - Sabtu, 07:00 - 17:00"></label>
  </div>
  <div class="mt-4 flex items-center gap-3"><button id="saveSettingsButton" class="bg-amber-400 px-4 py-3 text-xs font-bold text-zinc-950 hover:bg-amber-300">Simpan context AI</button><p id="settingsStatus" class="text-xs text-zinc-500"></p></div>
</section>
